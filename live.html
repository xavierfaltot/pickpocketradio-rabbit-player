<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=240,height=282,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pick Pocket LIVE — Rabbit r1</title><style>
*{box-sizing:border-box}html,body{margin:0;width:240px;height:282px;overflow:hidden;background:#000;font-family:Arial,sans-serif;color:#f5ecd8}
main{width:240px;height:282px;display:flex;flex-direction:column;align-items:center;padding:7px 10px}.logo{width:118px;height:118px;object-fit:contain}
.status{font-size:11px;font-weight:900;letter-spacing:1.5px;margin:1px 0 5px}.meter{width:190px;height:7px;background:#222;overflow:hidden;margin-bottom:5px}.meter i{display:block;height:100%;width:0;background:#eaff00}
button{width:190px;height:38px;border:0;border-radius:6px;font-size:12px;font-weight:900;letter-spacing:1px;margin:3px 0}.connect{background:#eaff00;color:#000;box-shadow:3px 3px 0 #ff1b8d}.take{background:#ff1b8d;color:#000;box-shadow:3px 3px 0 #eaff00}.end{background:#f5ecd8;color:#000}button:disabled{opacity:.25}.rec{font-size:7px;letter-spacing:1px;margin-top:5px;opacity:.7}.rec.on{color:#ff1b8d;opacity:1}
</style></head><body><main><img class="logo" id="logo" alt="Pick Pocket Radio"><div class="status" id="state">OFF AIR</div><div class="meter"><i id="meter"></i></div>
<button id="connect" class="connect">CONNECT MICRO</button><button id="take" class="take" disabled>TAKE ANTENNA</button><button id="end" class="end" disabled>END LIVE → SONO</button><div id="rec" class="rec">REC OFF</div><div style="font-size:6px;letter-spacing:1px;margin-top:2px">PICK POCKET CONTROL</div>
<script>
const API='https://debian.tail394dbb.ts.net/live/',$=x=>document.getElementById(x);let stream,ctx,src,proc,queue=Promise.resolve(),active=false;
fetch('logo-data.txt',{cache:'no-store'}).then(r=>r.text()).then(t=>$('logo').src='data:image/jpeg;base64,'+t.trim());
async function api(p,o={}){let r=await fetch(API+p,o);if(!r.ok)throw Error(await r.text());return r.json()}
function ui(s){$('take').disabled=!s.connected||s.on_air;$('end').disabled=!s.connected;$('state').textContent=s.on_air?'ON AIR':s.connected?'READY':'OFF AIR';$('rec').textContent=s.recording?'● REC':'REC OFF';$('rec').classList.toggle('on',s.recording)}
function pcm(ev){if(!active)return;let input=ev.inputBuffer.getChannelData(0),out=new Int16Array(input.length*2),peak=0;for(let i=0;i<input.length;i++){let v=Math.max(-1,Math.min(1,input[i]));peak=Math.max(peak,Math.abs(v));v=Math.max(-1,Math.min(1,v*8));let q=v<0?v*32768:v*32767;out[i*2]=q;out[i*2+1]=q}$('meter').style.width=(peak*100)+'%';let blob=new Blob([out.buffer]);queue=queue.then(()=>fetch(API+'api/pcm',{method:'POST',body:blob})).catch(()=>{})}
$('connect').onclick=async()=>{try{
$('state').textContent='MIC…';
if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw Error('NO GETUSERMEDIA');
stream=await navigator.mediaDevices.getUserMedia({audio:true});
$('state').textContent='LINK…';
await api('api/start',{method:'POST',headers:{'Content-Type':'application/json'},body:'{"name":"RABBIT"}'});
ctx=new (window.AudioContext||window.webkitAudioContext)();
await ctx.resume();
src=ctx.createMediaStreamSource(stream);
proc=ctx.createScriptProcessor(4096,1,1);
proc.onaudioprocess=pcm;
src.connect(proc);
let mute=ctx.createGain();mute.gain.value=0;proc.connect(mute);mute.connect(ctx.destination);
active=true;$('connect').textContent='MIC CONNECTED';ui(await api('api/state'))
}catch(e){$('state').textContent='ERR '+(e.name||'MIC');$('connect').textContent='TAP TO RETRY';console.log(e)}}
$('take').onclick=async()=>ui(await api('api/take',{method:'POST'}));$('end').onclick=async()=>{active=false;if(stream)stream.getTracks().forEach(t=>t.stop());if(proc)proc.disconnect();if(src)src.disconnect();if(ctx)ctx.close();ui(await api('api/end',{method:'POST'}));$('meter').style.width='0'};setInterval(()=>api('api/state').then(ui).catch(()=>{}),1000);api('api/state').then(ui).catch(()=>{});
</script></main></body></html>
