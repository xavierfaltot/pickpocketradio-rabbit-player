<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=240,height=282,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pick Pocket Radio — Rabbit r1</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:240px;height:282px;overflow:hidden;background:#000;font-family:Arial,Helvetica,sans-serif}body{touch-action:manipulation}main{width:240px;height:282px;background:#000;display:flex;flex-direction:column;align-items:center;padding:8px 12px;color:#f5ecd8}.logo{display:block;width:196px;height:196px;object-fit:contain;flex:none}.listen{margin-top:7px;width:184px;height:43px;border:0;border-radius:7px;background:#eaff00;color:#050505;box-shadow:5px 5px 0 #ff1b8d;font-size:15px;font-weight:900;letter-spacing:2px;cursor:pointer}.listen:active{transform:translate(3px,3px);box-shadow:2px 2px 0 #ff1b8d}.listen.playing{background:#ff1b8d;box-shadow:5px 5px 0 #eaff00}.listen .icon{display:inline-block;margin-right:10px;font-size:15px}.site{margin-top:13px;font-size:8px;font-weight:900;letter-spacing:1.5px;color:#f5ecd8}.berlin{margin-top:4px;font-size:6px;font-weight:700;letter-spacing:1.2px;color:#f5ecd8;opacity:.65}
</style>
</head>
<body>
<main>
<img class="logo" src="logo.svg" alt="Pick Pocket Radio">
<button class="listen" id="listen" aria-label="Listen to Pick Pocket Radio"><span class="icon" id="icon">▶</span><span id="label">LISTEN</span></button>
<div class="site">PICKPOCKETRADIO.ORG</div>
<div class="berlin">BROADCASTING FROM BERLIN</div>
<audio id="audio" preload="none" playsinline src="https://stream.radeo.fr/toutvabiensepasser.mp3"></audio>
</main>
<script>
(()=>{const audio=document.getElementById('audio'),btn=document.getElementById('listen'),icon=document.getElementById('icon'),label=document.getElementById('label');function state(on){btn.classList.toggle('playing',on);icon.textContent=on?'Ⅱ':'▶';label.textContent=on?'ON AIR':'LISTEN'}async function toggle(){if(audio.paused){label.textContent='CONNECTING';try{await audio.play();state(true)}catch(e){state(false)}}else{audio.pause();state(false)}}btn.addEventListener('click',toggle);window.addEventListener('sideClick',toggle);audio.addEventListener('playing',()=>state(true));audio.addEventListener('pause',()=>state(false));audio.addEventListener('error',()=>{state(false);label.textContent='RETRY'});})();
</script>
</body>
</html>
